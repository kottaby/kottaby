type ApplicantProfile {
  canPurchaseVerification: Boolean!
  cooldownActive: Boolean!
  cooldownUntil: DateTime
  id: Int!
  lastAttemptAt: DateTime
  status: ApplicantStatus!
  verificationAttempts: Int!
}

enum ApplicantStatus {
  Failed
  InEvaluation
  Passed
  Pending
}

input CreateSessionInput {
  intent: SessionIntent!
  teacherId: ID!
}

"""
A date-time string at UTC, such as 2007-12-03T10:15:30Z, compliant with the `date-time` format outlined in section 5.6 of the RFC 3339 profile of the ISO 8601 standard for representation of dates and times using the Gregorian calendar.
"""
scalar DateTime

enum Gender {
  Female
  Male
  Other
}

type HealthCheck {
  service: String!
  status: String!
  timestamp: String!
  version: String!
}

type LoginPayload {
  """
  Short-lived access token (15 min). Store in React memory; NEVER set as a cookie.
  """
  accessToken: String!

  """
  Long-lived refresh token (7 days). Also set as an httpOnly cookie by the route handler.
  """
  refreshToken: String!

  """The authenticated user."""
  user: User!
}

type LogoutPayload {
  """Whether the logout succeeded (always true — public mutation)."""
  success: Boolean!
}

type Mutation {
  """
  Cancel one of the caller's scheduled/started sessions (either participant) and release the held fee to its original lane. Non-participants and nonexistent ids are indistinguishable SESSION_NOT_FOUND denials.
  """
  cancelSession(id: ID!, reason: String): Session!

  """
  Complete one of the caller's started sessions (teacher-only; certification is re-asserted inside the guarded UPDATE).
  """
  completeSession(id: ID!): Session!

  """
  Book one session against a certified teacher. Student-only; the booking is idempotent per the X-Idempotency-Key request header (a replayed key surfaces DUPLICATE_REQUEST).
  """
  createSession(input: CreateSessionInput!): Session!

  """
  Authenticate with email + password. Returns the authenticated user + access + refresh tokens. The access_token + refresh_token + session_id are also set as httpOnly cookies.
  """
  login(email: String!, password: String!): LoginPayload!

  """
  Clears the access_token + refresh_token + session_id httpOnly cookies. Public — callable with an expired token. Always returns { success: true }.
  """
  logout: LogoutPayload!

  """
  Rotate the JWT pair from a valid refresh token. Returns fresh access + refresh tokens. The new access_token + refresh_token + session_id are also set as httpOnly cookies (rotation invalidates the prior pair).
  """
  refreshToken(refreshToken: String!): RefreshTokenPayload!
  registerUser(input: RegisterUserInput!): User!

  """
  Start one of the caller's scheduled sessions (teacher-only guarded transition).
  """
  startSession(id: ID!): Session!
}

type Query {
  _health: HealthCheck!

  """
  Returns the authenticated user (or null for anonymous). Anonymous callers receive null — the AuthProvider uses this to detect expired access tokens and silently restore the session via `refreshToken`.
  """
  me: User
  myApplicantProfile: ApplicantProfile
  myStudentSessions(filter: SessionListFilterInput, page: Int = 1, pageSize: Int = 25): SessionPage!
  myTeacherSessions(filter: SessionListFilterInput, page: Int = 1, pageSize: Int = 25): SessionPage!

  """
  Returns the canonical list of recitation readings (Qira'at) for the registration form selector. Public — no authentication required. The values are stable API identifiers; display labels are resolved client-side via the i18n recitation namespace.
  """
  recitationReadings: [RecitationReading!]!
  sessionById(id: ID!): Session
}

enum RecitationReading {
  AL_BAZZI_AN_IBN_KATHIR
  AL_DURI_AN_ABI_AMR
  AL_SUSI_AN_ABI_AMR
  HAFS_AN_ASIM
  KHALAF_AN_HAMZAH
  KHALLAD_AN_ASIM
  QALUN_AN_NAFI
  QUNBUL_AN_IBN_KATHIR
  SHUBAH_AN_ASIM
  WARSH_AN_NAFI
}

type RefreshTokenPayload {
  """Fresh short-lived access token (15 min)."""
  accessToken: String!

  """
  Fresh long-lived refresh token (7 days). Also set as an httpOnly cookie by the route handler (rotation).
  """
  refreshToken: String!
}

enum RegisterPublicRole {
  Parent
  Student
  Teacher
}

input RegisterUserInput {
  country: String!
  email: String!
  fullName: String!
  gender: Gender
  password: String!
  phone: String!
  preferredRecitation: RecitationReading
  role: RegisterPublicRole!
}

type Session {
  confirmationDeadline: DateTime
  confirmedByStudentAt: DateTime
  confirmedByTeacherAt: DateTime
  createdAt: DateTime!
  endedAt: DateTime
  fee: String
  feeHeld: Boolean!
  id: ID!
  intent: SessionIntent
  sessionType: SessionType!
  startedAt: DateTime
  status: SessionStatus!
  studentId: ID!
  teacherId: ID!
  updatedAt: DateTime!
}

enum SessionIntent {
  Evaluation
  Hifz
  Tajweed
}

input SessionListFilterInput {
  status: SessionStatus
}

type SessionPage {
  items: [Session!]!
  page: Int!
  pageSize: Int!
  totalCount: Int!
}

enum SessionStatus {
  Cancelled
  Completed
  Disputed
  Scheduled
  Started
}

enum SessionType {
  ReEvaluation
  StudentSession
  TeacherEvaluation
}

type User {
  country: String
  email: String!
  fullName: String!
  gender: Gender
  id: Int!
  isBlocked: Boolean!
  isDeleted: Boolean!
  phone: String

  """
  The user's preferred recitation reading (Qira'ah), selected during registration. Contract metadata — not persisted to the session-linked `recitation` table (C.5).
  """
  preferredRecitation: RecitationReading
  role: UserRole!
  suspended: Boolean!
}

enum UserRole {
  Admin
  Parent
  Student
  Teacher
}