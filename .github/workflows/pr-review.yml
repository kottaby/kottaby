name: Jules PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: jules-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      checks: write
    steps:
      - uses: thalesraymond/jules-pr-reviewer@v1
        continue-on-error: true
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          strictness: chill
          enable_suggestions: true
          # Strictly advisory: check run concludes success on any verdict and never blocks merges
          fail_on: never
          # Exclude lockfiles, generated code, and build artifacts from diff
          ignored_paths: |
            bun.lock
            frontend/graphql/generated/**
            .next/**
            dist/**
            test/logs/**
            coverage/**
