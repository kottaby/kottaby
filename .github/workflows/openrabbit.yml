name: 🐰 OpenRabbit Reviewer

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: openrabbit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: 🤖 AI Pull Request Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-socat-${{ hashFiles('.github/workflows/openrabbit.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-socat-
            ${{ runner.os }}-apt-

      - name: Install dependencies (socat)
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends socat

      - name: Start Shell NVIDIA Router
        env:
          NVIDIA_API_KEYS: ${{ secrets.NVIDIA_API_KEYS }}
          NVIDIA_API_KEYS_2: ${{ secrets.NVIDIA_API_KEYS_2 }}
          NVIDIA_API_KEYS_3: ${{ secrets.NVIDIA_API_KEYS_3 }}
          ROUTER_PORT: 20128
          COOLDOWN_SEC: 60
        run: |
          chmod +x .github/scripts/nvidia-router
          .github/scripts/nvidia-router start
          # Stream real-time router events and latencies directly to GitHub Actions console
          tail -n 0 -f /tmp/nvidia-router-20128.log &

      - name: OpenRabbit Review
        uses: aryanbrite/openrabbit@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          llm_provider: openrouter
          llm_api_url: http://127.0.0.1:20128/v1
          llm_api_key: "local-proxy"
          llm_model: ${{ secrets.LLM_MODEL }}
          review_mode: both
          tone_mode: balanced

      - name: Stop Shell NVIDIA Router & Print Metrics Summary
        if: always()
        env:
          ROUTER_PORT: 20128
        run: |
          echo ""
          echo "================================================================="
          echo "               SHELL NVIDIA ROUTER EVENT TRACE LOG               "
          echo "================================================================="
          cat /tmp/nvidia-router-20128.log 2>/dev/null || true
          echo ""
          echo "================================================================="
          echo "               SHELL NVIDIA ROUTER RUNTIME METRICS               "
          echo "================================================================="
          curl -s http://127.0.0.1:20128/health | jq . 2>/dev/null || curl -s http://127.0.0.1:20128/health || true
          echo ""
          echo "================================================================="
          .github/scripts/nvidia-router stop || true
